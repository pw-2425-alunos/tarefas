<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  {% load static %}
  <link rel="icon" href="{% static 'tarefas/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Tarefas</title>
  <style>
    
    ul {
      list-style: none;
      padding: 0;
    }

    li, #nova-tarefa {
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      background: #EAF6FF;
      border: 2px solid #95cff6;
      font-weight: bold;

      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    li button:nth-of-type(1) {
      margin-left: auto;
    }

    #nova-tarefa {
      background: #d7f4d7;
      border: 2px solid #4d7d4d;
    }

    #nova-tarefa 
    dialog {
      background: #efdbc1;
      border: 2px solid orange;
      border-radius: 10px;
    }

    #nova-tarefa input[type="submit"]{
      background: #4d7d4d;
      color: white;
    }

    dialog form, #nova-tarefa {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #form_editar button[type="submit"]{
      background: orange;
      color: white;
    }

    input, textarea, button {
        font-family: inherit;
        font-size: inherit;
        padding: 10px;
    }

  </style>
</head>

<body>
  <header>
    <h1>Gestão de Tarefas</h1>
  </header>
  <main>
    <section>
      <h2>Nova Tarefa</h2>
      <form id="nova-tarefa">
        <textarea id="titulo" placeholder="descreva a tarefa"  rows="2" required></textarea>
        <input type="number" id="prioridade" min="1" max="3" step="1" placeholder="prioridade [1, 2, 3]" required>
        <input type="text" id="user" placeholder="nome do utilizador" required>
        <button type="submit"><i data-lucide="plus"></i></button> 
      </form>
    </section>
    <section>
      <h2>Lista</h2>
      <ul></ul>
    </section>
    
  </main>
  <footer>Lusófona</footer>

  <dialog id="modal_editar">
    <h2>Editar Tarefa</h2>

    <form id="form_editar">
      <input type="hidden" id="edit_id">

      <textarea id="edit_titulo"  rows="3" required></textarea>
      <input type="number" id="edit_prioridade" min="1" max="3" step="1" placeholder="prioridade [1, 2, 3]" required>
      <input type="text" id="edit_user" placeholder="utilizador" required>
      <button type="submit" id="guarda-tarefa">Guardar</button>
      <button type="button" id="fechar_modal">Cancelar</button>
    </form>
  </dialog>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{% static 'tarefas/script.js' %}"></script>
  <script> lucide.createIcons(); </script>

</body>

</html>
