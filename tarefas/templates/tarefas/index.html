<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  {% load static %}
  <link rel="icon" href="{% static 'tarefas/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Tarefas</title>
  <style>
    button{
      margin-left: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li, #nova-tarefa {
      
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      background: #EAF6FF;
      border: 2px solid #95cff6;
      font-weight: bold;

      display: flex;
      flex-direction: row;
    }

    li button:nth-of-type(1) {
      margin-left: auto;
    }

    #nova-tarefa, #form_editar {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr auto auto;
    }

    #nova-tarefa input[type="submit"] {
      margin-left: auto;
    }

    dialog {
      background: #d7f4d7;
      border-radius: 10px;
    }
    dialog form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input,
    textarea {
        font-family: inherit;
        font-size: inherit;
    }

  </style>
</head>

<body>
  <header>
    <h1>Gestão de Tarefas</h1>
  </header>
  <main>
    <section>
      <h2>Nova Tarefa</h2>
      <form id="nova-tarefa">
        <textarea id="titulo" placeholder="descreva a tarefa" required></textarea>
        <input type="number" id="prioridade" min="1" max="3" step="1" placeholder="prioridade [1, 2, 3]" required>
        <input type="text" id="user" placeholder="utilizador" required>
        <input type="submit" value="criar nova tarefa">
      </form>
    </section>
    <section>
      <h2>Lista</h2>
      <ul></ul>
    </section>
    
  </main>
  <footer>Lusófona</footer>

  <dialog id="modal_editar">
    <h2>Editar Tarefa</h2>

    <form id="form_editar">
      <input type="hidden" id="edit_id">

      <textarea id="edit_titulo" required></textarea>
      <input type="number" id="edit_prioridade" min="1" max="3" step="1" placeholder="prioridade [1, 2, 3]" required>
      <input type="text" id="edit_user" placeholder="utilizador" required>
      <button type="submit">Guardar</button>
      <button type="button" id="fechar_modal">Cancelar</button>
    </form>
  </dialog>
  
  <script src="{% static 'tarefas/script.js' %}"></script>
</body>

</html>
